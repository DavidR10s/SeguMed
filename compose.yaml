services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: segumed-backend
    ports:
      - "8080:8080"
    environment:
       SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/segumed_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
       SPRING_DATASOURCE_USERNAME: "myuser"
       SPRING_DATASOURCE_PASSWORD: "secret"
       SPRING_DOCKER_COMPOSE_ENABLED: "false"
    depends_on:
       mysql:
          condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/target

  nginx:
    image: nginx:latest
    container_name: segumed-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html # Aquí colocaras luego tu build de Angular
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: segumed-mysql
    environment:
      MYSQL_DATABASE: segumed_db
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: verysecret
      MYSQL_USER: myuser
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data: