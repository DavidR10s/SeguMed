services:
  backend:
    build: ./backend
    container_name: segumed-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/segumed_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_DOCKER_COMPOSE_ENABLED=false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/target
  
  db:
    image: mysql:8.0
    container_name: segumed-mysql
    restart: always
    environment:
      MYSQL_DATABASE: segumed_db
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: verysecret
      MYSQL_USER: myuser
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1"]

  frontend:
    build: ./frontend
    container_name: segumed-nginx
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      
volumes:
  mysql_data: